[project]
name = "recipes"
description = "A cookbook for the python developer connoisseur 🐍🧑🏽‍🍳🍷"
authors = [
    {name = "Hannes Breytenbach", email = "hannes@saao.ac.za"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux"
]
dynamic = ["version", "readme"]

requires-python = ">=3.8"
dependencies = [
    "platformdirs",
    "click",
    "loguru",
    "anytree",
    "decorator",
    "stdlib_list",
    "more_itertools",

    "PyYAML",
    "psutil",

    "numpy",
    "joblib",
    "tqdm"
]

[project.optional-dependencies]
tests = ["pytest", "pytest-cases", "tox>=4.21", "tox-uv"]
dev = ["recipes[tests]"]

[dependency-groups]
tests = ["recipes[tests]"]
dev = ["recipes[dev]"]

[project.urls]
Homepage = "https://github.com/astromancer/recipes"
Issues = "https://github.com/astromancer/recipes/issues"

[project.scripts]
tidy_imports = "recipes.introspect.imports.tidy:main"

# ---------------------------------------------------------------------------- #
# Build
# ---------------------------------------------------------------------------- #
[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools_scm[toml]>=3.4",
    "wheel",
    "six"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "recipes._version.version"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools_scm]
write_to = "src/recipes/_version.py"


# ---------------------------------------------------------------------------- #
# Test
# ---------------------------------------------------------------------------- #
[tool.tox]
requires = ["tox>=4.21"]
# Generative environment list to test all supported Python versions
env_list = ["3.{8,9,10,11,12,13,14}"] # "fix", "coverage", "lint", "format", 

[tool.tox.env_run_base]
description = "run test suite"
deps = [{ replace = "ref", of = ["dependency-groups", "tests"], extend = true }]
extras = ["tests"]
package = "editable"
set_env = { LANGUAGE = "en_US", LC_ALL = "en_US.UTF-8", PYTHONWARNINGS = "default::DeprecationWarning" }
commands = [
    ["python", "--version"],
    # substitute with tox positional arguments
    ["python", "-m", "pytest", { replace = "posargs", default = [], extend = true }]
]


