[project]
name = "recipes"
description = "A cookbook for the python developer connoisseur 🐍🧑🏽‍🍳🍷"
authors = [
    {name = "Hannes Breytenbach", email = "hannes@saao.ac.za"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux"
]
dynamic = ["version", "readme"]

requires-python = ">=3.8"
dependencies = [
    "platformdirs",
    "click",
    "loguru",
    "anytree",
    "decorator",
    "stdlib_list",
    "more_itertools",

    "PyYAML",
    "psutil",

    "numpy",
    "joblib",
    "tqdm",

    "pydantic",
]

[project.optional-dependencies]
tests = ["tox>=4.21", "tox-uv", "pytest", "pytest-cases", "pytest-cov"]
docs = [ 
    "setuptools_scm", 
    "sphinx>=7.1",
    "sphinx-rtd-theme>=0.4.3",
    "sphinx_copybutton"
]
dev = ["uv", "ruff", "recipes[tests, docs]"]

[dependency-groups]
tests = ["recipes[tests]"]
docs = ["recipes[docs]"]
dev = ["recipes[dev]"]

[project.urls]
Homepage = "https://github.com/astromancer/recipes"
Issues = "https://github.com/astromancer/recipes/issues"
# Repository  = "https://github.com/astromancer/recipes"
# Changelog = "https://github.com/astromancer/recipes/blob/main/CHANGELOG.md"

[project.scripts]
tidy_imports = "recipes.introspect.imports.tidy:main"


# ---------------------------------------------------------------------------- #
# Build
# ---------------------------------------------------------------------------- #
[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools_scm[toml]>=3.4",
    "wheel",
    "six"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "recipes._version.version"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools_scm]
write_to = "src/recipes/_version.py"


# ---------------------------------------------------------------------------- #
# Test
# ---------------------------------------------------------------------------- #
[tool.tox]
requires = ["tox>=4.21"]
# Generative environment list to test all supported Python versions
env_list = ["lint", "3.{8,9,10,11,12,13,14}"] # "fix", "coverage", "format", 

[tool.tox.env_run_base]
description = "run test suite"
deps = [{ replace = "ref", of = ["dependency-groups", "tests"], extend = true }]
extras = ["tests"]
package = "editable"
set_env = { LANGUAGE = "en_US", LC_ALL = "en_US.UTF-8", PYTHONWARNINGS = "default::DeprecationWarning" }
commands = [
    ["python", "--version"],
    # substitute with tox positional arguments
    ["python", "-m", "pytest", { replace = "posargs", default = [], extend = true }]
]

# ---------------------------------------------------------------------------- #
# Lint
# ---------------------------------------------------------------------------- #
# Command prefixes to reuse the same virtualenv for all linting jobs.
[tool.tox.env.lint]
# deps = ["ruff"]
extras = ["dev"]
commands = [
    ["python", "-m", "ruff", "--version"],
    ["python", "-m", "ruff", "check", 
     { replace = "posargs", default = [], extend = true }]
]

[tool.tox.env.format]
deps = ["ruff"]
commands = [
    ["python", "-m", "ruff", "format", "-v", 
     { replace = "posargs", default = [], extend = true }]
]

[tool.ruff]
exclude = [
    ".git",
    ".tox",
    ".venv",
    ".hypothesis",
    "dist",
    "docs",
    "*lib/python*",
    "*egg",
    "_version.py",
    "__pycache__",
    "tests"
]

[tool.ruff.lint]
# Expand basic rules with name and style checks roughly equivalent to flake8 + black + pylint
# Some additional functional errors such as `await` on none async or wrong return types / args.
# More info https://docs.astral.sh/ruff/rules/
select = ["N", "A", "E", "F", "B", "W", "Q", "PL", "ASYNC", "S", "G", "RET", "ARG", "I"]

# ignore: 
# PLR2004: magic-value-comparison
# I001:  Import block is un-sorted or un-formatted
ignore = ["PLR2004", "I001"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"


# ---------------------------------------------------------------------------- #
# Docs
# ---------------------------------------------------------------------------- #
[tool.tox.env.docs]
deps = [{ replace = "ref", of = ["dependency-groups", "docs"], extend = true }]
extras = ["docs"]
# unset LC_ALL / LANGUAGE from testenv, would fail sphinx otherwise
set_env = ""
changedir = "{tox_root}"
allowlist_externals = ["rm"]
commands = [
    ["rm", "-rf", "docs/build/html"],
    ["python", "-m", "sphinx.cmd.build", "-b", "html", "docs/src", "docs/build/html", "-j4"]
]

